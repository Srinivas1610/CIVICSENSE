# ============================================================
# CivicConnect — NGINX Ingress Gateway
# Routes:
#   /api/citizens      -> citizen-service:3001
#   /api/issues        -> issue-service:3002
#   /api/assignments   -> assignment-service:3003
#   /api/notifications -> notification-service:3004
#   /                  -> frontend-service:80
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civicconnect-ingress
  namespace: civicconnect
  labels:
    app: civicconnect
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: civicconnect.local
      http:
        paths:
          - path: /api/citizens
            pathType: Prefix
            backend:
              service:
                name: citizen-service
                port:
                  number: 3001
          - path: /api/issues
            pathType: Prefix
            backend:
              service:
                name: issue-service
                port:
                  number: 3002
          - path: /api/assignments
            pathType: Prefix
            backend:
              service:
                name: assignment-service
                port:
                  number: 3003
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 3004
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
    - http:
        paths:
          - path: /api/citizens
            pathType: Prefix
            backend:
              service:
                name: citizen-service
                port:
                  number: 3001
          - path: /api/issues
            pathType: Prefix
            backend:
              service:
                name: issue-service
                port:
                  number: 3002
          - path: /api/assignments
            pathType: Prefix
            backend:
              service:
                name: assignment-service
                port:
                  number: 3003
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 3004
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
---
# NodePort Service for external frontend access
apiVersion: v1
kind: Service
metadata:
  name: civicconnect-frontend-nodeport
  namespace: civicconnect
  labels:
    app: civicconnect
spec:
  type: NodePort
  selector:
    app: frontend-service
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
---
# NodePort Service for Minikube citizen API access
apiVersion: v1
kind: Service
metadata:
  name: civicconnect-nodeport
  namespace: civicconnect
  labels:
    app: civicconnect
spec:
  type: NodePort
  selector:
    app: citizen-service
  ports:
    - name: citizen
      port: 3001
      targetPort: 3001
      nodePort: 30001
