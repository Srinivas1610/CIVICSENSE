apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  namespace: civicconnect
  labels:
    app: frontend-service
    version: v1.0.0
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend-service
        version: v1.0.0
    spec:
      containers:
        - name: frontend-service
          image: ghcr.io/YOUR_GITHUB_USERNAME/civicconnect-frontend-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      terminationGracePeriodSeconds: 15
