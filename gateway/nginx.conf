events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    upstream frontend_upstream {
        server frontend-service:80;
    }

    upstream citizen_upstream {
        server citizen-service:3001;
    }

    upstream issue_upstream {
        server issue-service:3002;
    }

    upstream assignment_upstream {
        server assignment-service:3003;
    }

    upstream notification_upstream {
        server notification-service:3004;
    }

    server {
        listen 80;
        server_name localhost civicconnect.local civic.local _;

        client_max_body_size 20M;

        # Frontend Web Application
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Citizen Service
        location /api/citizens {
            proxy_pass http://citizen_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Issue Service
        location /api/issues {
            proxy_pass http://issue_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Assignment Service
        location /api/assignments {
            proxy_pass http://assignment_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Notification Service
        location /api/notifications {
            proxy_pass http://notification_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Gateway Health Probe
        location /health {
            access_log off;
            return 200 '{"status":"ok","gateway":"nginx-reverse-proxy"}\n';
            add_header Content-Type application/json;
        }
    }
}
