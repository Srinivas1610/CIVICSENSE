# ============================================================
# CivicConnect — GitHub Actions CI/CD Pipeline
# Cloud Computing & DevOps Laboratory (CCDL)
# ============================================================
name: CivicConnect CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/civicconnect

jobs:

  # ─────────────────────────────────────────────────────
  # JOB 1: Run Unit & Integration Tests (Matrix Strategy)
  # ─────────────────────────────────────────────────────
  test:
    name: Test — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - citizen-service
          - issue-service
          - assignment-service
          - notification-service
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Run TypeScript type check
        working-directory: services/${{ matrix.service }}
        run: npx tsc --noEmit

      - name: Run unit tests with coverage
        working-directory: services/${{ matrix.service }}
        run: npm test -- --coverage --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          directory: services/${{ matrix.service }}/coverage
          flags: ${{ matrix.service }}
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────
  # JOB 2: Lint & Validate Kubernetes Manifests
  # ─────────────────────────────────────────────────────
  validate-manifests:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubeval
        run: |
          wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin

      - name: Validate manifests
        run: |
          find k8s -name "*.yaml" -not -name "kustomization.yaml" | \
            xargs kubeval --strict --ignore-missing-schemas
        continue-on-error: true

      - name: Validate Terraform files
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'

      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

  # ─────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────
  # JOB 3: Build & Push Docker Images
  # ─────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: citizen-service
            context: services/citizen-service
            dockerfile: services/citizen-service/Dockerfile
          - service: issue-service
            context: services/issue-service
            dockerfile: services/issue-service/Dockerfile
          - service: assignment-service
            context: services/assignment-service
            dockerfile: services/assignment-service/Dockerfile
          - service: notification-service
            context: services/notification-service
            dockerfile: services/notification-service/Dockerfile
          - service: frontend-service
            context: services/frontend-service
            dockerfile: services/frontend-service/Dockerfile
          - service: gateway
            context: gateway
            dockerfile: gateway/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

  # ─────────────────────────────────────────────────────
  # JOB 4: Deploy to Kubernetes
  # ─────────────────────────────────────────────────────
  deploy:
    name: Deploy to K3s Cluster
    runs-on: ubuntu-latest
    needs: [build-and-push, validate-manifests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: http://${{ secrets.SERVER_IP }}:30001

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update image tags in manifests
        run: |
          SHA_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          for SERVICE in citizen-service issue-service assignment-service notification-service frontend-service; do
            if [ -f "k8s/${SERVICE}/deployment.yaml" ]; then
              sed -i "s|:latest|:${SHA_TAG}|g" k8s/${SERVICE}/deployment.yaml
              sed -i "s|YOUR_GITHUB_USERNAME|${{ github.repository_owner }}|g" k8s/${SERVICE}/deployment.yaml
            fi
          done

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/mongodb/statefulset.yaml
          kubectl apply -f k8s/citizen-service/
          kubectl apply -f k8s/issue-service/
          kubectl apply -f k8s/assignment-service/
          kubectl apply -f k8s/notification-service/
          kubectl apply -f k8s/frontend-service/
          kubectl apply -f k8s/ingress.yaml

      - name: Wait for rollout
        run: |
          for SVC in citizen-service issue-service assignment-service notification-service frontend-service; do
            echo "Waiting for $SVC rollout..."
            kubectl rollout status deployment/$SVC -n civicconnect --timeout=120s
          done

      - name: Verify health endpoints
        run: |
          sleep 10
          SERVER_IP="${{ secrets.SERVER_IP }}"
          echo "Checking service health..."
          curl -f http://${SERVER_IP}:30001/health || echo "citizen-service health check failed"

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ CivicConnect deployed successfully!"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Timestamp: $(date -u)"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed, rolling back..."
          kubectl rollout undo deployment/citizen-service -n civicconnect || true
          kubectl rollout undo deployment/issue-service -n civicconnect || true
          kubectl rollout undo deployment/assignment-service -n civicconnect || true
          kubectl rollout undo deployment/notification-service -n civicconnect || true
          kubectl rollout undo deployment/frontend-service -n civicconnect || true
          echo "Rollback complete."
